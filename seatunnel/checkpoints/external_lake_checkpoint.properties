# SeaTunnel engine checkpoint configuration for external Kafka→Iceberg sync jobs.
# Copy or template this file into your runtime environment and adjust values as needed.
seatunnel.engine.checkpoint.interval=30000
seatunnel.engine.checkpoint.timeout=60000
seatunnel.engine.checkpoint.storage.type=hdfs
seatunnel.engine.checkpoint.storage.hdfs.path=hdfs://hdfs-prod:9000/checkpoints/external-lake
seatunnel.engine.checkpoint.storage.hdfs.user=aurum
seatunnel.engine.checkpoint.storage.parallelism=1
seatunnel.engine.checkpoint.storage.max-retained=10
