name: "aurum"
version: "1.1.0"
config-version: 2
profile: "aurum"

model-paths: ["dbt/models"]
macro-paths: ["dbt/macros"]
seed-paths: ["dbt/seeds"]
snapshot-paths: ["dbt/snapshots"]
analysis-paths: ["dbt/analysis"]
target-path: "artifacts/dbt/target"
clean-targets:
  - "artifacts/dbt/target"
  - "artifacts/dbt/dbt_packages"

models:
  aurum:
    +persist_docs:
      relation: true
      columns: true
    +materialized: view
    +contract:
      enforced: true
    stg:
      +schema: stg
    int:
      +schema: int
    marts:
      +schema: mart

seeds:
  +persist_docs:
    relation: true
    columns: true
  aurum:
    ref:
      +schema: "{{ target.schema ~ '_ref' if target.name == 'duckdb' else 'ref' }}"
    raw:
      +schema: "{{ target.schema ~ '_raw' if target.name == 'duckdb' else 'raw' }}"
    market:
      +schema: market_seed
    timescale:
      +schema: "{{ target.schema ~ '_public' if target.name == 'duckdb' else 'public' }}"
      +database: "{{ 'timeseries' if target.name != 'duckdb' else (target.database if target.database else 'main') }}"
    environment:
      +schema: "{{ target.schema ~ '_environment' if target.name == 'duckdb' else 'environment' }}"
