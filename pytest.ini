[tool:pytest]
testpaths = tests
addopts =
    -q
    -ra
    --disable-warnings
    --cov=src/aurum/api/services
    --cov-fail-under=85
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --timeout=30
    --maxfail=5

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use containers)
    e2e: End-to-end tests (external processes, slowest)
    contract: API contract tests (OpenAPI compliance)
    perf: Performance regression tests
    slow: Tests that take longer than 10 seconds
    golden: Tests that compare against golden files

asyncio_mode = strict

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::DeprecationWarning:tests.*
    error::DeprecationWarning:src.*
