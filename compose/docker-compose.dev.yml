version: '3.8'

services:
  # Core Infrastructure
  postgres:
    image: postgres:15
    profiles: [core]
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"

  redis:
    image: redis:7
    profiles: [core]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    profiles: [core]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    profiles: [core]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    profiles: [core]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8181:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:438
    profiles: [core]
    environment:
      TRINO_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ../trino/catalog:/etc/trino/catalog
      - ../trino/jvm.config:/etc/trino/jvm.config
      - ../trino/config.properties:/etc/trino/config.properties
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.15.0
    profiles: [core]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=aurum-dev
      - node.name=aurum-node-1
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: minio/minio:latest
    profiles: [core]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_REQUESTS_MAX: 1000
    ports:
      - "9100:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    image: aurum-api:dev
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      trino:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    ports:
      - "8095:8080"  # Map container 8080 to host 8095 as documented
    environment:
      AURUM_APP_DB_DSN: postgresql://aurum:aurum@postgres:5432/aurum
      AURUM_CACHE_REDIS_DSN: redis://redis:6379
      AURUM_API_DATA_BACKEND: trino
      AURUM_API_AUTH_DISABLED: "1"
      AURUM_API_CORS_ORIGINS: "*"
      AURUM_API_GZIP_MIN_BYTES: "500"
      AURUM_API_METRICS_ENABLED: "1"
      AURUM_API_METRICS_PATH: "/metrics"
      AURUM_API_RATE_LIMIT_RPS: "100"
      AURUM_API_RATE_LIMIT_BURST: "200"
      AURUM_RATE_LIMIT_DEFAULT_RPS: "100"
      AURUM_SESSION_TIMEOUT_MINUTES: "480"
      AURUM_SECURITY_AUDIT_ENABLED: "0"
      AURUM_TENANT_ISOLATION_ENABLED: "0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AURUM_TRINO_HOST: trino
      AURUM_TRINO_PORT: 8080
      AURUM_ENVIRONMENT: dev
      AURUM_LOG_LEVEL: INFO
      AURUM_SEARCH_HOSTS: http://elasticsearch:9200
    # In dev container images already include code/config; volume mounts disabled to avoid iCloud FS issues.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: aurum-worker:dev
    profiles: [worker]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      AURUM_APP_DB_DSN: postgresql://aurum:aurum@postgres:5432/aurum
      AURUM_CACHE_REDIS_DSN: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      AURUM_ENVIRONMENT: dev
      AURUM_LOG_LEVEL: INFO
    # Use baked-in worker image contents (no bind mounts) for dev stack stability.

  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    profiles: [core]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/ddl_ops.sql:/docker-entrypoint-initdb.d/ddl_ops.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8123/ping || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://aurum:aurum@postgres:5432/aurum
      AIRFLOW__CORE__FERNET_KEY: b2F1cnVtLWRldi1mZXJuZXQta2V5LTIwMjU=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: ["bash", "-lc", "airflow db upgrade && airflow users create -r Admin -u admin -p admin -e admin@local -f Admin -l User || true"]
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.9.3
    profiles: [core]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8088:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://aurum:aurum@postgres:5432/aurum
      AIRFLOW__CORE__FERNET_KEY: b2F1cnVtLWRldi1mZXJuZXQta2V5LTIwMjU=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: ["bash", "-lc", "airflow webserver"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

  airflow-scheduler:
    image: apache/airflow:2.9.3
    profiles: [core]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://aurum:aurum@postgres:5432/aurum
      AIRFLOW__CORE__FERNET_KEY: b2F1cnVtLWRldi1mZXJuZXQta2V5LTIwMjU=
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: ["bash", "-lc", "airflow scheduler"]

  # One-shot bootstrap job: buckets + schema registry
  bootstrap:
    image: aurum-api:dev
    profiles: [bootstrap]
    depends_on:
      minio:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      # MinIO endpoint and credentials for bucket bootstrap
      AURUM_S3_ENDPOINT: http://minio:9000
      AURUM_S3_REGION: us-east-1
      AURUM_S3_ACCESS_KEY: minioadmin
      AURUM_S3_SECRET_KEY: minioadmin
      # KMS key placeholder for SSE-KMS bucket
      AURUM_CURATED_KMS_KEY: local-dev-kms-key
      # Schema Registry
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PYTHONPATH: /app/src
    working_dir: /app
    volumes:
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
      - ../src:/app/src:ro
    command: ["bash", "-lc", "python scripts/storage/bootstrap_minio.py && scripts/kafka/bootstrap.sh --schema-registry-url ${SCHEMA_REGISTRY_URL}"]

  # UI helpers
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [ui]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  superset:
    image: apache/superset:latest
    profiles: [ui]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: dev-secret-key
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_PORT: 8088
      SUPERSET_DATABASE_URI: postgresql+psycopg2://aurum:aurum@postgres:5432/aurum

  superset-init:
    image: apache/superset:latest
    profiles: [ui]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: dev-secret-key
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_DATABASE_URI: postgresql+psycopg2://aurum:aurum@postgres:5432/aurum
    command: ["bash", "-lc", "superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@local --password admin || true && superset init"]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  elasticsearch_data:
  clickhouse_data:
  airflow_logs:

networks:
  default:
    driver: bridge


