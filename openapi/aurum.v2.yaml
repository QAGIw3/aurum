components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: Unique correlation identifier for the request.
      schema:
        type: string
    XApiVersion:
      description: Semantic version for the served API surface.
      schema:
        type: string
    PaginationLink:
      description: RFC 8288 formatted pagination links.
      schema:
        type: string
    RateLimitLimit:
      description: Maximum number of requests allowed in the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Epoch seconds when the rate limit window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds until clients may retry after rate limiting.
      schema:
        type: integer
    ETag:
      description: Strong validator for response caching.
      schema:
        type: string
  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: true
      description: Tenant identifier scoping the request.
      schema:
        type: string
        pattern: "^[a-zA-Z0-9-_]+$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor for pagination.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  responses:
    UnauthorizedError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      description: Authentication failed or not supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      description: The request payload or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplementedError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      description: The requested capability is not implemented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      description: The client is authenticated but not authorized for the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      description: The request rate has exceeded the allowed threshold.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ResponseMeta:
      type: object
      description: Telemetry metadata returned by the Aurum API gateway.
      properties:
        operation:
          type: string
        query_time_ms:
          type: number
          format: float
        record_count:
          type: integer
        pagination:
          type: object
          additionalProperties: true
      additionalProperties: true
    PaginationLinks:
      type: object
      description: Hypermedia pagination link container.
      additionalProperties:
        type: string
    OperationStatusEnvelope:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          $ref: '#/components/schemas/OperationStatus'
      required: [meta, data]
    OperationStatus:
