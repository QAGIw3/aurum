      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /v2/dbt/models:
    get:
      tags: [DBT Management]
      summary: List dbt models
      operationId: listDbtModels
      parameters:
      - name: model_type
        in: query
        required: false
        schema:
          type: string
        description: model_type for GET /v2/dbt/models.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: status for GET /v2/dbt/models.
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
