      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
  /v2/dbt/marts:
    post:
      tags: [DBT Management]
      summary: Create data mart definition
      operationId: createDbtMart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MartCreateRequest'
      responses:
        '201':
          description: Mart creation acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusEnvelope'
          headers:
