            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Collect Prometheus metrics snapshot
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
  /v2/performance/health:
    get:
      tags: [Performance Monitoring]
      summary: Get performance monitoring health
      operationId: getPerformanceMonitoringHealth
      responses:
        '200':
          description: Current health of the performance monitoring subsystem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMapEnvelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Link:
              $ref: '#/components/headers/PaginationLink'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Get performance monitoring health
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
  /v2/dbt/test:
    post:
      tags: [DBT Management]
      summary: Run dbt tests
      operationId: runDbtTests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DBTModelTestRequest'
      responses:
        '202':
          description: dbt test execution results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBTTestResult'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Run dbt tests
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
  /v2/dbt/build:
    post:
      tags: [DBT Management]
      summary: Run dbt build
      operationId: runDbtBuild
      parameters:
      - name: models
        in: query
        required: false
        description: Optional list of model selectors to build.
        schema:
          type: array
          items:
            type: string
          style: form
          explode: true
      - $ref: '#/components/parameters/TenantId'
      responses:
        '202':
          description: Build invocation acknowledgement with telemetry metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMapEnvelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Run dbt build
      security:
      - BearerAuth: []
  /v2/dbt/fixtures/generate:
    post:
      tags: [DBT Management]
      summary: Generate test fixtures
      operationId: generateDbtFixtures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixtureGenerationRequest'
      responses:
        '201':
          description: Fixture generation results by fixture name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixtureGenerationEnvelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
