openapi: 3.1.0
info:
  title: Aurum API v2
  version: 2.0.0
  description: |
    High-level OpenAPI description for the Aurum v2 surface area. This document focuses on
    the new platform routers covering performance monitoring, dbt management, automatic
    reforecast orchestration, the machine-learning model registry, developer workspace
    utilities, and the enhanced PPA contracts API.
  contact:
    name: Aurum Platform Team
    email: api@aurum.dev
servers:
- url: https://api.aurum.dev
  description: Production
- url: https://api.sandbox.aurum.dev
  description: Sandbox
security:
- BearerAuth: []
tags:
- name: Performance Monitoring
- name: DBT Management
- name: Auto Reforecast
- name: Model Registry
- name: Developer Workspace
- name: PPA
paths:
  /v2/performance/budgets:
    get:
      tags: [Performance Monitoring]
      summary: List performance budgets
      description: Retrieve the configured performance budgets with compliance metadata.
      operationId: listPerformanceBudgets
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Performance budgets with compliance context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceBudgetListResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Link:
              $ref: '#/components/headers/PaginationLink'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
    post:
      tags: [Performance Monitoring]
      summary: Create performance budget
      description: Create a new performance budget definition for an API endpoint.
      operationId: createPerformanceBudget
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceBudgetCreateRequest'
      responses:
        '201':
          description: Budget creation acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusEnvelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /v2/performance/scenarios:
    get:
      tags: [Performance Monitoring]
      summary: List load test scenarios
      description: Retrieve load test scenarios configured for performance gating.
      operationId: listLoadTestScenarios
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Load test scenarios and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadTestScenarioListResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Link:
              $ref: '#/components/headers/PaginationLink'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /v2/performance/scenarios/{scenario_id}/run:
    post:
      tags: [Performance Monitoring]
      summary: Run load test scenario
      description: Invoke execution of the specified load test scenario.
      operationId: runLoadTestScenario
      security:
      - BearerAuth: []
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          description: Scenario identifier
        description: Scenario identifier
      - $ref: '#/components/parameters/TenantId'
      responses:
        '202':
          description: Scenario execution accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRunResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v2/performance/tests/{test_id}:
    get:
      tags: [Performance Monitoring]
      summary: Get load test result
      operationId: getPerformanceTestResult
      parameters:
      - name: test_id
        in: path
        required: true
        schema:
          type: string
          description: Performance test identifier
        description: test_id for GET /v2/performance/tests/{test_id}.
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Load test execution outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceTestResult'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Link:
              $ref: '#/components/headers/PaginationLink'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Get load test result
      security:
      - BearerAuth: []
  /v2/performance/dashboard:
    get:
      tags: [Performance Monitoring]
      summary: Get performance dashboard snapshot
      operationId: getPerformanceDashboard
      responses:
        '200':
          description: Aggregated performance dashboard data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceDashboard'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Link:
              $ref: '#/components/headers/PaginationLink'
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Get performance dashboard snapshot
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
  /v2/performance/compare:
    post:
      tags: [Performance Monitoring]
      summary: Compare performance test runs
      operationId: comparePerformanceRuns
      parameters:
      - name: baseline_test_id
        in: query
        required: true
        schema:
          type: string
          description: Baseline test identifier
        description: baseline_test_id for POST /v2/performance/compare.
      - name: current_test_id
        in: query
        required: true
        schema:
          type: string
          description: Current test identifier to compare
        description: current_test_id for POST /v2/performance/compare.
      - $ref: '#/components/parameters/TenantId'
      responses:
        '201':
          description: Comparison outcome between performance runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceComparison'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Compare performance test runs
      security:
      - BearerAuth: []
  /v2/performance/ci-check:
    post:
      tags: [Performance Monitoring]
      summary: Run CI performance check
      operationId: runPerformanceCiCheck
      responses:
        '202':
          description: CI check execution acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMapEnvelope'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Run CI performance check
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
