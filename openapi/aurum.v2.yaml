        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      description: Create data mart definition
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [DBT Management]
      summary: List data marts
      operationId: listDbtMarts
      responses:
        '200':
          description: Data mart definitions available in the workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MartResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Link:
              $ref: '#/components/headers/PaginationLink'
