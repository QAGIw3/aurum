  /v2/dbt/health:
    get:
      tags: [DBT Management]
      summary: Get dbt management health
      operationId: getDbtHealth
      responses:
        '200':
          description: Health status envelope for dbt management subsystems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMapEnvelope'
