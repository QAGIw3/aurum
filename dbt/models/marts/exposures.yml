version: 2
exposures:
- name: scenario_outputs_mart
  type: dashboard
  maturity: medium
  url: https://internal.aurum.local/dashboards/scenario
  depends_on:
  - ref('mart_scenario_output')
  - ref('mart_scenario_metric_latest')
  owner:
    name: Scenario Analytics
    email: analytics@aurum.local
- name: iceberg_maintenance
  type: application
  maturity: low
  url: https://airflow.aurum.local/dag/iceberg_maintenance
  description: Scheduled job that expires Iceberg snapshots and compacts data files.
  depends_on:
  - source('iceberg_market', 'curve_observation')
  - source('iceberg_market', 'scenario_output')
  owner:
    name: Platform Operations
    email: platform@aurum.local
- name: data_dictionary_publication
  type: analysis
  maturity: high
  url: https://internal.aurum.local/catalog/data-dictionary
  description: Markdown data dictionary generated from dbt documentation and exposures metadata.
  depends_on:
  - ref('dim_iso')
  - ref('dim_market')
  - ref('fct_curve_observation')
  - ref('mart_scenario_output')
  tags:
  - documentation
  - governance
  owner:
    name: Data Platform
    email: data-platform@aurum.local
  meta:
    publish_path: docs/data_dictionary.md
- name: metric_catalog_publication
  type: analysis
  maturity: medium
  url: https://internal.aurum.local/catalog/metric-catalog
  description: Published metric catalog enumerating scenario and market KPIs sourced from marts.
  depends_on:
  - ref('mart_scenario_metric_latest')
  - ref('mart_cpi_series_latest')
  - ref('mart_eia_series_latest')
  - ref('mart_fred_series_latest')
  tags:
  - metrics
  - governance
  owner:
    name: Data Platform
    email: data-platform@aurum.local
  meta:
    publish_path: docs/metric_catalog.md
- name: api_scenarios_v1
  type: application
  maturity: high
  url: https://api.aurum.local/v1/scenarios
  description: Scenario listing endpoint used by external clients for discovery and pagination.
  depends_on:
  - ref('mart_scenario_overview')
  - ref('int_scenario_run_metrics')
  - ref('stg_scenarios')
  tags:
  - api
  - scenarios
  owner:
    name: API Platform
    email: platform@aurum.local
  meta:
    methods:
    - GET
    - HEAD
    domain: scenarios
    service: aurum-api
- name: api_scenario_runs_v1
  type: application
  maturity: medium
  url: https://api.aurum.local/v1/scenarios/{scenario_id}/runs
  description: Provides paginated scenario run history to API consumers.
  depends_on:
  - ref('stg_scenario_runs')
  - ref('int_scenario_run_metrics')
  tags:
  - api
  - scenarios
  owner:
    name: API Platform
    email: platform@aurum.local
  meta:
    methods:
    - GET
    domain: scenarios
    service: aurum-api
- name: api_ppa_valuations_v2
  type: application
  maturity: medium
  url: https://api.aurum.local/v2/ppa/valuations
  description: Valuation endpoint combining scenario outputs with PPA cashflow metrics.
  depends_on:
  - ref('mart_ppa_valuation')
  - ref('mart_scenario_output')
  - ref('mart_scenario_overview')
  tags:
  - api
  - valuations
  owner:
    name: API Platform
    email: platform@aurum.local
  meta:
    methods:
    - GET
    domain: ppa
    service: aurum-api
- name: api_curve_observations_v1
  type: application
  maturity: high
  url: https://api.aurum.local/v1/curves
  description: Legacy curves endpoint serving market observations backed by Iceberg publishing models.
  depends_on:
  - ref('publish_curve_observation')
  - ref('fct_curve_observation')
  tags:
  - api
  - curves
  owner:
    name: API Platform
    email: platform@aurum.local
  meta:
    methods:
    - GET
    - HEAD
    domain: curves
    service: aurum-api
