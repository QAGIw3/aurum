name: Maintenance Weekly

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality,test]"

      - name: Run cleanup
        run: python3 scripts/maintenance/cleanup.py

      - name: Update dependencies & generate reports
        run: python3 scripts/maintenance/update_deps.py

      - name: Summary report
        run: python3 scripts/maintenance/report.py > reports/summary.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-weekly-artifacts
          path: |
            reports/**


