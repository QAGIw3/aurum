name: dbt CI

on:
  pull_request:
    paths:
      - 'dbt/**'
      - 'tests/dbt/**'
      - 'constraints/**'
      - 'pyproject.toml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c constraints/dev.txt

      - name: Prepare dbt profile
        run: |
          mkdir -p ~/.dbt
          cp tests/dbt/profiles.yml ~/.dbt/profiles.yml

      - name: Seed data
        run: |
          dbt seed --profiles-dir ~/.dbt --project-dir . --target duckdb --full-refresh

      - name: Build CI models
        run: |
          dbt build --profiles-dir ~/.dbt --project-dir . --target duckdb --selector ci --fail-fast

      - name: Run generic tests
        run: |
          dbt test --profiles-dir ~/.dbt --project-dir . --target duckdb --selector ci --fail-fast

      - name: Generate docs
        run: |
          dbt docs generate --profiles-dir ~/.dbt --project-dir . --target duckdb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            artifacts/dbt/target
            artifacts/dbt/warehouse.duckdb

