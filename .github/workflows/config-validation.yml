name: Configuration Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'config/**'
      - '.github/workflows/config-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'config/**'

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate configuration schemas
      run: |
        python -c "
        from aurum.config.validation import export_all_schemas, validate_and_coerce_config
        from aurum.config.dynamic_config import DynamicConfigService
        import json

        # Export schemas for validation
        export_all_schemas('config/schemas')

        # Test configuration loading and validation for each environment
        environments = ['development', 'staging', 'production']
        for env in environments:
            try:
                service = DynamicConfigService(environment=env)
                config = service.get()
                validated_config = validate_and_coerce_config(config, strict_mode=True)
                print(f'✅ Configuration for {env} is valid')
            except Exception as e:
                print(f'❌ Configuration validation failed for {env}: {e}')
                exit(1)

        print('✅ All configuration validations passed')
        "

    - name: Check for secrets in configuration
      run: |
        python -c "
        import os
        import json
        import re

        def check_for_secrets(config_data, path=''):
            secrets_found = []

            if isinstance(config_data, dict):
                for key, value in config_data.items():
                    current_path = f'{path}.{key}' if path else key

                    # Check for common secret patterns
                    if isinstance(value, str):
                        if (re.search(r'(?i)(password|secret|key|token)', current_path) or
                            re.search(r'(?i)(api_key|access_token|secret_key)', current_path)):
                            if len(value) > 10:  # Likely a real secret
                                secrets_found.append(current_path)

                    # Recursively check nested structures
                    if isinstance(value, (dict, list)):
                        nested_secrets = check_for_secrets(value, current_path)
                        secrets_found.extend(nested_secrets)

            elif isinstance(config_data, list):
                for i, item in enumerate(config_data):
                    current_path = f'{path}[{i}]'
                    if isinstance(item, (dict, list)):
                        nested_secrets = check_for_secrets(item, current_path)
                        secrets_found.extend(nested_secrets)

            return secrets_found

        # Check all environment configurations
        from aurum.config.dynamic_config import DynamicConfigService

        environments = ['development', 'staging', 'production']
        for env in environments:
            service = DynamicConfigService(environment=env)
            config = service.get()

            secrets = check_for_secrets(config)
            if secrets:
                print(f'❌ Potential secrets found in {env} configuration:')
                for secret in secrets:
                    print(f'  - {secret}')
                exit(1)

        print('✅ No secrets detected in configuration files')
        "

    - name: Generate configuration documentation
      run: |
        python scripts/config/diff.py export-schema --output=config/schemas
        echo "Configuration schemas exported to config/schemas/"

    - name: Upload schema artifacts
      uses: actions/upload-artifact@v3
      with:
        name: config-schemas
        path: config/schemas/
        retention-days: 30
