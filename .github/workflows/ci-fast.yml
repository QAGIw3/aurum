name: CI Fast

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.pre-commit-config.yaml'
      - '.github/workflows/**'
  workflow_dispatch: {}

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (fast lane)
        run: |
          python -m pip install --upgrade pip
          # Minimal deps for fast lint + unit tests
          pip install -e .
          pip install pre-commit commitizen \
                     pytest pytest-xdist pytest-asyncio pytest-mock pytest-cov hypothesis fakeredis

      - name: Pre-commit (lint/format)
        run: pre-commit run --all-files

      - name: Conventional Commits check
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          cz check --message "$COMMIT_MSG"

      - name: CI test suite (fast path)
        run: make ci-test

