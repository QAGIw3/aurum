name: CI Full

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.pre-commit-config.yaml'
      - '.github/workflows/**'
  workflow_dispatch: {}

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types-security:
    name: Lint, Types, Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quality,test]"

      - name: Pre-commit (lint/format)
        run: pre-commit run --all-files

      - name: Dead code scan (vulture)
        run: |
          mkdir -p reports
          vulture src/ --min-confidence 80 --sort-by-size > reports/vulture.txt || true

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p reports
          cyclonedx-py --format json --output reports/sbom.json || true

      - name: Upload maintenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-artifacts
          path: |
            reports/vulture.txt
            reports/sbom.json

      - name: Type check (mypy)
        run: mypy src

      - name: Security scans
        run: make security-scan

  unit-tests:
    name: Unit Tests with coverage
    runs-on: ubuntu-latest
    needs: lint-types-security
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run CI test suite
        run: make ci-test

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    if: ${{ !contains(github.event.head_commit.message, '[skip integration]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run integration tests
        run: make integration-test

