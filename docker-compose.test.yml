version: '3.8'

services:
  # PostgreSQL for metadata and operational data
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum_test_pass
      POSTGRES_DB: aurum_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB for time-series data
  timescale-test:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum_test_pass
      POSTGRES_DB: timeseries_test
    ports:
      - "5434:5432"
    volumes:
      - timescale_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Trino for federated SQL queries (testing against Iceberg)
  trino-test:
    image: trinodb/trino:latest
    ports:
      - "8081:8080"
    volumes:
      - ./conf/trino:/etc/trino
    environment:
      - TRINO_ENVIRONMENT=test
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MinIO for S3-compatible storage (for Iceberg)
  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9001:9000"
      - "9091:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ClickHouse for analytics (optional)
  clickhouse-test:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8124:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_USER: aurum
      CLICKHOUSE_PASSWORD: aurum_test_pass
      CLICKHOUSE_DB: aurum_test
    volumes:
      - clickhouse_test_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_test_data:
  timescale_test_data:
  minio_test_data:
  clickhouse_test_data:

networks:
  default:
    name: aurum-test-network

